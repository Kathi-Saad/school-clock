<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التاريخ والوقت - منصة المدرسة</title>

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
padding: 0;
width: 100%;
overflow: hidden;
font-family: Tahoma, Arial, sans-serif;
background: transparent;
}

.card {
width: 100%;
max-width: 100%;
margin: 0 auto;
padding: 10px 8px;
border-radius: 14px;
text-align: center;
color: #fff;
background: linear-gradient(135deg,#176b68,#278f86);
box-shadow: 0 3px 12px #0002;
}

.day {
font-size: 19px;
font-weight: bold;
}

.time {
font-size: clamp(30px, 7vw, 42px);
font-weight: bold;
margin: 5px 0;
direction: ltr;
font-variant-numeric: tabular-nums;
}

.date {
font-size: 14px;
line-height: 1.7;
}
</style>
</head>

<body>
<div class="card">
<div class="day" id="day">مرحبًا بكم</div>
<div class="time" id="time">00:00:00</div>
<div class="date" id="hijri"></div>
<div class="date" id="gregorian"></div>
</div>

<script>
function updateClock() {
const now = new Date();
const zone = "Asia/Riyadh";

document.getElementById("day").textContent =
new Intl.DateTimeFormat("ar-SA", {
weekday: "long",
timeZone: zone
}).format(now);

document.getElementById("time").textContent =
new Intl.DateTimeFormat("en-GB", {
hour: "2-digit",
minute: "2-digit",
second: "2-digit",
hour12: false,
timeZone: zone
}).format(now);

document.getElementById("hijri").textContent =
"التاريخ الهجري: " +
new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", {
day: "numeric",
month: "long",
year: "numeric",
timeZone: zone
}).format(now);

document.getElementById("gregorian").textContent =
"التاريخ الميلادي: " +
new Intl.DateTimeFormat("ar-SA", {
day: "numeric",
month: "long",
year: "numeric",
timeZone: zone
}).format(now);
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
